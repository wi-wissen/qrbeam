<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QRbeam</title>
<style>
  :root {
    --bg: #f9f9fb; --fg: #15141a; --muted: #5b5b66; --line: #e0e0e6; --btn: rgba(21,20,26,.07); --btn-hover: rgba(21,20,26,.12);
    --primary: #0061e0; --primary-hover: #0250bb; --primary-fg: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #2b2a33; --fg: #fbfbfe; --muted: #bfbfc9; --line: #52525e; --btn: rgba(251,251,254,.09); --btn-hover: rgba(251,251,254,.15);
      --primary: #00ddff; --primary-hover: #80ebff; --primary-fg: #15141a;
      color-scheme: dark;
    }
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, sans-serif; padding: 24px 24px 20px; display: grid; gap: 14px; }
  header { display: flex; align-items: center; gap: 12px; }
  header img { width: 32px; height: 32px; }
  h1 { font-size: 17px; margin: 0; font-weight: 650; }
  p { margin: 0; color: var(--muted); }
  p strong { color: var(--fg); font-weight: 600; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  button { font: inherit; border: 0; border-radius: 4px; padding: 7px 16px; cursor: pointer; background: var(--btn); color: var(--fg); }
  button:hover { background: var(--btn-hover); }
  button.primary { background: var(--primary); color: var(--primary-fg); font-weight: 600; }
  button.primary:hover { background: var(--primary-hover); }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
</style>
</head>
<body>
  <header><img src="icons/icon.svg" alt=""><h1 data-i18n="consentTitle"></h1></header>
  <p data-i18n="consentText"></p>
  <p data-i18n="consentOnce"></p>
  <div class="actions">
    <button id="deny" type="button" data-i18n="consentDeny"></button>
    <button id="allow" class="primary" type="button" data-i18n="consentAllow"></button>
  </div>
  <script src="consent.js"></script>
</body>
</html>

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, e.g. 1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check version format
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.0 (three numbers, no v)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check that v${{ inputs.version }} does not exist yet
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists. Pick a higher version."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint

      - name: Sign Firefox add-on (unlisted, not shown on addons.mozilla.org)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::Secrets AMO_JWT_ISSUER and AMO_JWT_SECRET are missing. See README, section Maintainers."
            exit 1
          fi
          npx web-ext sign \
            --source-dir dist/firefox \
            --artifacts-dir dist/signed \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --approval-timeout 900000
          xpi=$(ls dist/signed/*.xpi | head -n1)
          test -n "$xpi"
          mv "$xpi" dist/qrbeam-firefox.xpi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          **Install:** https://wi-wissen.github.io/qrbeam/

          - Firefox: \`qrbeam-firefox.xpi\` (signed by Mozilla, updates automatically)
          - Chrome, Edge, Brave, Vivaldi, Opera: \`qrbeam-chrome.zip\`, unzip and load via Developer mode

          NOTES
          gh release create "v$VERSION" \
            dist/qrbeam-chrome.zip dist/qrbeam-firefox.xpi \
            --target "$(git rev-parse HEAD)" \
            --title "QRbeam $VERSION" \
            --notes-file notes.md \
            --generate-notes

  pages:
    needs: release
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
